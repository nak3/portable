# GitHub Actions workflow to run tests on Linux.
name: "Linux"

on:
  push: {}
  pull_request: {}
  schedule:
    - cron: "0 0 * * *" # At 00:00 daily.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

jobs:
  # Test against all supported architectures.
  test:
    name: "${{ matrix.os }}/${{ matrix.arch }} (${{ matrix.compiler }})"
    runs-on: "${{ matrix.os }}"
    if: ${{ github.repository_owner == 'libressl' || github.event_name != 'schedule' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        arch: ["native", "arm32", "arm64", "mingw32", "mingw64", "mips32", "mips64"]
        compiler: ["gcc"]
        include:
          - os: "ubuntu-22.04"
            arch: "native"
            compiler: "clang"
          - os: "ubuntu-24.04"
            arch: "native"
            compiler: "clang"
          - os: "ubuntu-24.04" # loong64
            arch: "loong64"
            compiler: "gcc"
          - os: "ubuntu-24.04-arm"
            arch: "native"
            compiler: "gcc"
          - os: "ubuntu-24.04-arm"
            arch: "native"
            compiler: "clang"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install test dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libio-socket-ssl-perl
          perl -MIO::Socket::SSL::Utils -e 1

      - name: "Run tests"
        run: ./scripts/test || (status=$?; cat tests/test-suite.log; exit $status)
        env:
          ARCH: "${{ matrix.arch }}"
          CC: "${{ matrix.compiler }}"

  # Test ASAN with and without ASM enabled.
  test-asan:
    name: "${{ matrix.os }} - ASAN (${{ matrix.asm == 'ON' && 'asm' || 'no-asm' }})"
    runs-on: "${{ matrix.os }}"
    if: ${{ github.repository_owner == 'libressl' || github.event_name != 'schedule' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        asm: [ON, OFF]
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install test dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libio-socket-ssl-perl
          perl -MIO::Socket::SSL::Utils -e 1

      - name: "Run tests"
        run: ./scripts/test
        env:
          ARCH: "native"
          CC: "clang"
          CFLAGS: "-ggdb -fsanitize=address"
          LDFLAGS: "-fsanitize=address"
          ENABLE_ASM: "${{ matrix.asm }}"
          CTEST_OUTPUT_ON_FAILURE: 1

  # Test the C implementations for undefined behavior. Assembly code cannot be
  # instrumented by UBSAN, so disable it here to maximize sanitizer coverage.
  test-ubsan:
    name: "${{ matrix.os }} - UBSAN"
    runs-on: "${{ matrix.os }}"
    if: ${{ github.repository_owner == 'libressl' || github.event_name != 'schedule' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install test dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libio-socket-ssl-perl
          perl -MIO::Socket::SSL::Utils -e 1

      - name: "Run tests"
        shell: bash
        run: |
          test_status=0
          ./scripts/test || test_status=$?

          if ((test_status != 0)); then
            while IFS= read -r -d '' log; do
              cat "$log"
            done < <(find . -type f -name test-suite.log -print0)
          fi

          shopt -s nullglob
          ubsan_logs=("$GITHUB_WORKSPACE"/ubsan.*)
          if ((${#ubsan_logs[@]} > 0)); then
            echo "::group::UndefinedBehaviorSanitizer reports"
            cat "${ubsan_logs[@]}"
            echo "::endgroup::"
            exit 1
          fi

          exit "$test_status"
        env:
          ARCH: "native"
          CC: "clang"
          # Ignore legacy callback type erasure and avoid unchecked inline-asm loads;
          # retain the remaining UBSan checks for actionable reports.
          CFLAGS: >-
            -O1 -ggdb -fno-omit-frame-pointer
            -D__STRICT_ALIGNMENT -DOPENSSL_NO_INLINE_ASM
            -fsanitize=address,undefined -fno-sanitize=function
          LDFLAGS: "-fsanitize=address,undefined"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=0:log_path=${{ github.workspace }}/ubsan"
          ENABLE_ASM: "OFF"
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: "Upload UBSAN reports"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "ubsan-${{ matrix.os }}"
          path: "ubsan.*"
          if-no-files-found: ignore
