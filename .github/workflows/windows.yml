# GitHub Actions workflow to run tests on Windows.
name: "Windows"

on:
  workflow_call:

jobs:
  test:
    name: "${{ matrix.os }}/${{ matrix.arch }} (${{ matrix.shared == 'ON' && 'shared' || 'static' }})"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "windows-2025"]
        arch: ["ARM64", "x64", "Win32"]
        shared: ["ON", "OFF"]
    steps:
      - name: "Download prepared source"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "prepared-source"

      - name: "Extract prepared source"
        shell: bash
        run: |
          mkdir source
          tar -xzf libressl-*.tar.gz -C source --strip-components=1

      - name: "Setup MSYS2"
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          update: true
          install: >-
            diffutils
            gcc
            git
            patch
            perl
            perl-IO-Socket-SSL

      - name: "Configure CMake"
        shell: pwsh
        run: |
          $perl = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr\bin\perl.exe'
          & $perl -MIO::Socket::SSL::Utils -e 1
          if ($LASTEXITCODE -ne 0) {
            throw "IO::Socket::SSL::Utils is unavailable"
          }
          $generator = cmake --help |
            Select-String '^\s*\*?\s*(Visual Studio \d+ \d+)' |
            Select-Object -First 1 |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $generator) {
            throw "No Visual Studio CMake generator found"
          }
          Write-Host "Using generator: $generator"
          cmake -S source -B build -G "$generator" -A ${{ matrix.arch }} -D BUILD_SHARED_LIBS=${{ matrix.shared }} -D CMAKE_INSTALL_PREFIX=../local "-DPERL_EXECUTABLE=$perl"

      - name: "Build"
        shell: cmd
        run: cmake --build build --config Release

      - name: "Test"
        if: matrix.arch != 'ARM64'
        shell: cmd
        run: ctest --test-dir build -C Release --output-on-failure

      - name: "Upload build artifacts"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ matrix.os }}-${{ matrix.arch }}${{ matrix.shared == 'ON' && '-shared' || '' }}-build-results"
          path: "build"
