# GitHub Actions workflow to run rust-openssl regress tests.
name: "rust-openssl"

on:
  workflow_dispatch:
  push:
    branches: [rust-openssl-test]
  schedule:
    - cron: "0 0 * * *" # At 00:00 daily.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: "Test (${{ matrix.variant }})"
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, revert-v3-only]
    runs-on: "ubuntu-26.04"
    if: ${{ github.repository_owner == 'libressl' || github.event_name != 'schedule' }}
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Prepare LibreSSL sources"
        run: |
          ./autogen.sh
          git -C openbsd rev-parse HEAD

      - name: "Reverse the X.509 v3-only change"
        if: ${{ matrix.variant == 'revert-v3-only' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("crypto/x509/x509_purp.c")
          original = source.read_text()
          current = "\tversion = X509_get_version(x);\n\tif (version != 2)\n"
          previous = "\tversion = X509_get_version(x);\n\tif (version < 0 || version > 2)\n"
          if original.count(current) != 1:
              raise SystemExit("Expected one version check from upstream commit 2c4a3b22")
          source.write_text(original.replace(current, previous))
          PY

      - name: "Build LibreSSL"
        run: |
          ./configure --prefix="${HOME}/opt"
          make all install

      - name: "Clone rust-openssl"
        run: |
          git clone https://github.com/rust-openssl/rust-openssl.git
          git -C rust-openssl rev-parse HEAD

      - name: "Run rust-openssl tests"
        run: |
          cd rust-openssl
          # instead of erroring use the last supported version
          ed -s openssl-sys/build/main.rs <<-EOF
          /_ => version_error/-1
          .t.
          s/(.*=/_ =
          +1d
          w
          q
          EOF
          export OPENSSL_DIR=${HOME}/opt LD_LIBRARY_PATH=${HOME}/opt/lib
          cargo test --verbose
