# GitHub Actions workflow to run tests on macOS.
name: "macOS"

on:
  workflow_call:

jobs:
  test:
    name: "${{ matrix.os }}/${{ matrix.arch }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-26", "macos-15", "macos-14"]
        arch: ["arm64", "x86_64"]
    steps:
    - name: "Install required packages"
      run: |
        brew install automake libtool perl cpanminus
        PERL="$(brew --prefix perl)/bin/perl"
        "$PERL" "$(command -v cpanm)" --notest IO::Socket::SSL
        echo "$(brew --prefix perl)/bin" >> "$GITHUB_PATH"
        "$PERL" -MIO::Socket::SSL::Utils -e 1

    - name: "Download prepared source"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: "prepared-source"

    - name: "Extract prepared source"
      run: |
        mkdir source
        tar -xzf libressl-*.tar.gz -C source --strip-components=1

    - name: "Run tests"
      run: ./scripts/test
      working-directory: source
      env:
        ARCH: "${{ matrix.arch }}"
        OS: "${{ matrix.os }}"
        PREPARED_SOURCE: 1
