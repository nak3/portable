name: "Daily performance report"

on:
  push: {}
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC.
  workflow_dispatch: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: "${{ matrix.arch }} performance"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "x86_64"
            os: "ubuntu-24.04"
          - arch: "arm64"
            os: "ubuntu-24.04-arm"
    env:
      REPETITIONS: 3

    steps:
      - name: "Checkout portable"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Generated sources are intentionally not committed to portable.
      - name: "Checkout OpenBSD source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "libressl/openbsd"
          ref: "master"
          fetch-depth: 8
          path: "openbsd"
          persist-credentials: false

      - name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: "Generate source tree"
        run: ./update.sh

      - name: "Record environment"
        run: |
          mkdir results
          {
            echo "portable: $(git rev-parse HEAD)"
            echo "openbsd: $(git -C openbsd rev-parse HEAD)"
            echo "runner: $RUNNER_NAME"
            uname -a
            cmake --version
            ninja --version
            gcc --version
            lscpu
          } > results/environment.txt

      - name: "Build LibreSSL"
        run: |
          cmake -S . -B build-performance -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DENABLE_ASM=ON \
            -DLIBRESSL_APPS=ON \
            -DLIBRESSL_TESTS=OFF
          cmake --build build-performance --target openssl --parallel 4

      - name: "Run benchmarks"
        shell: bash
        run: |
          set -euo pipefail

          benchmarks=(
            sha256
            sha512
            aes-128-gcm
            aes-256-gcm
            chacha20-poly1305
            ecdsap256
            mlkem768
          )

          for ((round = 1; round <= REPETITIONS; round++)); do
            build-performance/apps/openssl/openssl speed -mr "${benchmarks[@]}" \
              > "results/run-${round}.txt" 2>&1
          done

      - name: "Write performance report"
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/summarize-speed.py \
            --input 'results/run-*.txt' \
            --output results/report.md

          cpu_model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          {
            cat results/report.md
            echo "### Environment"
            echo
            echo "- Architecture: \`${{ matrix.arch }}\`"
            echo "- CPU: \`${cpu_model}\`"
            echo "- portable: \`$(git rev-parse HEAD)\`"
            echo "- OpenBSD: \`$(git -C openbsd rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload performance report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "performance-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "results"
          if-no-files-found: warn
          retention-days: 90
