# GitHub Actions workflow to prepare the source tree once and run the main CI.
name: "CI"

on:
  push: {}
  pull_request: {}
  # Linux and Emscripten run daily. Windows and macOS additionally run on Sunday.
  schedule:
    - cron: "0 0 * * 1-6"
    - cron: "0 0 * * 0"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-source:
    name: "Prepare source"
    runs-on: "ubuntu-24.04"
    if: ${{ github.repository_owner == 'libressl' || github.event_name != 'schedule' }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Generate source distribution"
        run: |
          ./autogen.sh
          ./configure
          make dist

      - name: "Upload prepared source"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "prepared-source"
          path: "libressl-*.tar.gz"
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  linux:
    name: "Linux"
    needs: ["prepare-source"]
    uses: ./.github/workflows/linux.yml

  emscripten:
    name: "Emscripten"
    needs: ["prepare-source"]
    uses: ./.github/workflows/emscripten.yml

  windows:
    name: "Windows"
    needs: ["prepare-source"]
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 0 * * 0' }}
    uses: ./.github/workflows/windows.yml

  macos:
    name: "macOS"
    needs: ["prepare-source"]
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 0 * * 0' }}
    uses: ./.github/workflows/macos.yml

  android:
    name: "Android"
    needs: ["prepare-source"]
    if: ${{ github.event_name != 'schedule' }}
    uses: ./.github/workflows/android.yml

  cmake-check:
    name: "CMake Check"
    needs: ["prepare-source"]
    if: ${{ github.event_name != 'schedule' }}
    uses: ./.github/workflows/cmake-config.yml
